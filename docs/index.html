<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UpdateCatch - 실시간 소프트웨어 업데이트 피드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); }
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand-gradient { font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.4rem; }
        .card-custom { border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
        .badge-target { font-weight: 600; padding: 0.35em 0.7em; border-radius: 6px; }
        .badge-vscode { background-color: #007acc; color: white; }
        .badge-python { background-color: #3776ab; color: white; }
        .badge-gemini { background-color: #4285f4; color: white; }
        .badge-claude { background-color: #d97706; color: white; }
        .badge-openai { background-color: #10a37f; color: white; }
        .badge-dotnet { background-color: #512bd4; color: white; }
        .badge-macos { background-color: #1d1d1f; color: white; }
        .badge-windows { background-color: #0078d4; color: white; }
        .badge-default { background-color: #64748b; color: white; }
        .tag-pill { font-size: 0.75rem; background-color: #e2e8f0; color: #475569; border-radius: 9999px; padding: 0.2rem 0.6rem; margin-right: 0.3rem; display: inline-block; }
        .tag-ai { background-color: #f3e8ff; color: #7e22ce; }
        .tag-security { background-color: #fee2e2; color: #b91c1c; }
        .tag-breaking { background-color: #ffedd5; color: #c2410c; }
        .tag-perf { background-color: #dcfce7; color: #15803d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand navbar-brand-gradient d-flex align-items-center gap-2" href="./index.html">
                <i class="bi bi-radar text-primary fs-3"></i>
                <span>UpdateCatch</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link px-3 fw-bold text-dark" href="./index.html">
                            <i class="bi bi-clock-history me-1"></i> 타임라인 피드
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 fw-semibold text-primary" href="./search.html">
                            <i class="bi bi-stars me-1"></i> AI 시맨틱 검색
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 fw-semibold" href="./targets.html">
                            <i class="bi bi-collection me-1"></i> 모니터링 타겟
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button id="translateAllBtn" class="btn btn-sm btn-outline-primary fw-semibold" onclick="toggleTranslateAll()">
                        <i class="bi bi-translate me-1"></i> <span id="translateAllText">전체 한글 번역 🇰🇷</span>
                    </button>
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                        <i class="bi bi-check-circle me-1"></i> GitHub Pages Live
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-clock-history text-primary me-2"></i>최신 업데이트 타임라인
                </h2>
                <p class="text-muted mb-0">VS Code, Python, Gemini, Claude, OpenAI의 업데이트 소식을 깃허브에서 자동 수집합니다.</p>
            </div>
            <div class="col-md-5 text-md-end mt-3 mt-md-0">
                <a href="./search.html" class="btn btn-outline-primary fw-semibold me-2">
                    <i class="bi bi-stars me-1"></i> AI 시맨틱 검색
                </a>
                <a href="./targets.html" class="btn btn-light border fw-semibold">
                    <i class="bi bi-gear me-1"></i> 타겟 관리
                </a>
            </div>
        </div>

        <!-- 필터 칩 -->
        <div class="d-flex flex-wrap gap-2 mb-4 pb-2 border-bottom" id="filterContainer">
            <button class="btn btn-sm btn-dark fw-bold filter-btn" onclick="filterReleases('')">전체 보기</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('vscode')"><i class="bi bi-code-square me-1"></i> VS Code</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('python')"><i class="bi bi-filetype-py me-1"></i> Python</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('gemini')"><i class="bi bi-google me-1"></i> Google Gemini</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('claude')"><i class="bi bi-robot me-1"></i> Anthropic Claude</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('openai')"><i class="bi bi-chat-left-dots me-1"></i> OpenAI GPT</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('dotnet')"><i class="bi bi-microsoft me-1"></i> .NET</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('macos')"><i class="bi bi-apple me-1"></i> macOS</button>
            <button class="btn btn-sm btn-light border filter-btn" onclick="filterReleases('windows')"><i class="bi bi-windows me-1"></i> Windows</button>
        </div>

        <!-- 로딩 상태 -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">최신 업데이트 데이터를 불러오는 중...</p>
        </div>

        <!-- 카드 그리드 -->
        <div class="row g-4" id="releasesGrid" style="display: none;"></div>
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            UpdateCatch &copy; 2026 - Hosted on GitHub Pages & Automated by GitHub Actions
        </div>
    </footer>

    <script>
        let allReleases = [];
        let currentTarget = '';

        async function loadData() {
            try {
                const res = await fetch('./data/releases.json?t=' + Date.now());
                allReleases = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('releasesGrid').style.display = 'flex';
                render();
            } catch (err) {
                document.getElementById('loading').innerHTML = '<div class="alert alert-warning">데이터를 불러오지 못했습니다. GitHub Actions 수집을 확인해 주세요.</div>';
            }
        }

        function filterReleases(targetId) {
            currentTarget = targetId;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'btn btn-sm btn-light border filter-btn';
            });
            event.target.className = 'btn btn-sm btn-dark fw-bold filter-btn';
            render();
        }

        function getBadgeClass(id) {
            switch ((id || '').toLowerCase()) {
                case 'vscode': return 'badge-vscode';
                case 'python': return 'badge-python';
                case 'gemini': return 'badge-gemini';
                case 'claude': return 'badge-claude';
                case 'openai': return 'badge-openai';
                case 'dotnet': return 'badge-dotnet';
                case 'macos': return 'badge-macos';
                case 'windows': return 'badge-windows';
                default: return 'badge-default';
            }
        }

        function getTagClass(tag) {
            const t = (tag || '').toLowerCase();
            if (t.includes('ai') || t.includes('copilot')) return 'tag-ai';
            if (t.includes('security')) return 'tag-security';
            if (t.includes('breaking')) return 'tag-breaking';
            if (t.includes('perf')) return 'tag-perf';
            return '';
        }

        function render() {
            const grid = document.getElementById('releasesGrid');
            grid.innerHTML = '';

            const filtered = currentTarget 
                ? allReleases.filter(r => (r.TargetId || '').toLowerCase() === currentTarget.toLowerCase())
                : allReleases;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-12"><div class="card p-5 text-center bg-white border-0 shadow-sm rounded-4"><h5 class="text-muted">수집된 릴리즈가 없습니다.</h5></div></div>';
                return;
            }

            filtered.forEach(rel => {
                const col = document.createElement('div');
                col.className = 'col-lg-6';
                
                const tagsHtml = (rel.Tags || []).map(t => `<span class="tag-pill ${getTagClass(t)}">#${t}</span>`).join('');
                const takeaways = (rel.KeyTakeaways || []).map(k => `<li class="mb-1">${k}</li>`).join('');
                const takeawaysHtml = rel.KeyTakeaways && rel.KeyTakeaways.length > 0 
                    ? `<div class="p-3 bg-light rounded-3 mb-3 border-start border-4 border-primary">
                         <div class="fw-semibold small text-primary mb-1"><i class="bi bi-lightning-charge-fill me-1"></i>핵심 하이라이트 요약</div>
                         <ul class="mb-0 ps-3 small text-secondary">${takeaways}</ul>
                       </div>`
                    : '';

                const pubDate = rel.PublishedAt ? new Date(rel.PublishedAt).toISOString().split('T')[0] : '';
                const linkHtml = rel.HtmlUrl ? `<a href="${rel.HtmlUrl}" target="_blank" class="btn btn-sm btn-outline-dark">공식 원문 보기 <i class="bi bi-box-arrow-up-right ms-1"></i></a>` : '';

                col.innerHTML = `
                    <div class="card card-custom h-100 bg-white p-4 d-flex flex-column" id="card-${rel.Id}">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge badge-target ${getBadgeClass(rel.TargetId)}">${rel.TargetName}</span>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-sm btn-light border text-primary fw-semibold px-2 py-0" style="font-size: 0.75rem;" onclick="toggleCardTranslation('${rel.Id}')" id="btn-trans-${rel.Id}">
                                    <i class="bi bi-translate me-1"></i>한글 번역
                                </button>
                                <small class="text-muted"><i class="bi bi-calendar3 me-1"></i>${pubDate}</small>
                            </div>
                        </div>
                        <h5 class="fw-bold text-dark mb-2 mt-1" id="title-${rel.Id}">${rel.Title}</h5>
                        <div class="mb-3">${tagsHtml}</div>
                        <div id="takeaways-${rel.Id}">${takeawaysHtml}</div>
                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="badge bg-secondary-subtle text-secondary">버전: ${rel.Version || ''}</span>
                            ${linkHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        // --- 무료 한글 번역 엔진 (API Key 불필요) ---
        const translationCache = new Map();
        let isAllTranslated = false;

        async function fetchGoogleTranslate(text) {
            if (!text || text.trim().length === 0) return text;
            if (translationCache.has(text)) return translationCache.get(text);

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data[0]) {
                    const translated = data[0].map(chunk => chunk[0]).join('');
                    translationCache.set(text, translated);
                    return translated;
                }
            } catch (e) {
                console.error('Translation failed for:', text, e);
            }
            return text;
        }

        async function toggleCardTranslation(relId) {
            const rel = allReleases.find(r => r.Id === relId);
            if (!rel) return;

            const titleEl = document.getElementById(`title-${relId}`);
            const takeawaysEl = document.getElementById(`takeaways-${relId}`);
            const btnEl = document.getElementById(`btn-trans-${relId}`);

            const isCurrentlyKo = btnEl.getAttribute('data-translated') === 'true';

            if (isCurrentlyKo) {
                // 원문 복구
                titleEl.innerText = rel.Title;
                if (rel.KeyTakeaways && rel.KeyTakeaways.length > 0) {
                    const takeaways = rel.KeyTakeaways.map(k => `<li class="mb-1">${k}</li>`).join('');
                    takeawaysEl.innerHTML = `
                        <div class="p-3 bg-light rounded-3 mb-3 border-start border-4 border-primary">
                            <div class="fw-semibold small text-primary mb-1"><i class="bi bi-lightning-charge-fill me-1"></i>핵심 하이라이트 요약</div>
                            <ul class="mb-0 ps-3 small text-secondary">${takeaways}</ul>
                        </div>`;
                }
                btnEl.innerHTML = '<i class="bi bi-translate me-1"></i>한글 번역';
                btnEl.setAttribute('data-translated', 'false');
                btnEl.className = 'btn btn-sm btn-light border text-primary fw-semibold px-2 py-0';
            } else {
                // 한글 번역 수행
                btnEl.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>번역 중...';
                
                const koTitle = await fetchGoogleTranslate(rel.Title);
                titleEl.innerText = koTitle;

                if (rel.KeyTakeaways && rel.KeyTakeaways.length > 0) {
                    const koTakeaways = await Promise.all(rel.KeyTakeaways.map(t => fetchGoogleTranslate(t)));
                    const takeawaysHtml = koTakeaways.map(k => `<li class="mb-1">${k}</li>`).join('');
                    takeawaysEl.innerHTML = `
                        <div class="p-3 bg-light rounded-3 mb-3 border-start border-4 border-primary">
                            <div class="fw-semibold small text-primary mb-1"><i class="bi bi-lightning-charge-fill me-1"></i>핵심 하이라이트 요약 (한국어)</div>
                            <ul class="mb-0 ps-3 small text-secondary">${takeawaysHtml}</ul>
                        </div>`;
                }

                btnEl.innerHTML = '<i class="bi bi-arrow-counterclockwise me-1"></i>원문 보기';
                btnEl.setAttribute('data-translated', 'true');
                btnEl.className = 'btn btn-sm btn-primary text-white fw-semibold px-2 py-0';
            }
        }

        async function toggleTranslateAll() {
            const allBtns = document.querySelectorAll('[id^="btn-trans-"]');
            const mainBtnText = document.getElementById('translateAllText');

            if (!isAllTranslated) {
                mainBtnText.innerText = '전체 원문 보기 🇺🇸';
                for (const btn of allBtns) {
                    if (btn.getAttribute('data-translated') !== 'true') {
                        const relId = btn.id.replace('btn-trans-', '');
                        await toggleCardTranslation(relId);
                    }
                }
                isAllTranslated = true;
            } else {
                mainBtnText.innerText = '전체 한글 번역 🇰🇷';
                for (const btn of allBtns) {
                    if (btn.getAttribute('data-translated') === 'true') {
                        const relId = btn.id.replace('btn-trans-', '');
                        await toggleCardTranslation(relId);
                    }
                }
                isAllTranslated = false;
            }
        }

        loadData();
    </script>
</body>
</html>
